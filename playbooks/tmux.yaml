---
- name: tmux
  hosts: localhost
  tasks:
    - name: Clone
      ansible.builtin.git:
        repo: 'https://github.com/tmux/tmux.git'
        dest: "{{ [distfiles_dir, 'tmux'] | path_join }}"
        single_branch: true
        version: "{{ env_lock['tmux'] }}"

    - name: Autogen
      ansible.builtin.command:
        cmd: ./autogen.sh
        chdir: "{{ [distfiles_dir, 'tmux'] | path_join }}"

    - name: Configure
      ansible.builtin.command:
        argv:
          - ./configure
          - "LIBEVENT_CORE_CFLAGS=-I{{ [distfiles_dir, 'libevent', 'include'] | path_join }} -I{{ [distfiles_dir, 'libevent', 'build', 'include'] | path_join }}"
          - "LIBEVENT_CORE_LIBS={{ [distfiles_dir, 'libevent', 'build', 'lib', 'libevent_core.a'] | path_join }}"
        chdir: "{{ [distfiles_dir, 'tmux'] | path_join }}"

    - name: Build
      community.general.make:
        chdir: "{{ [distfiles_dir, 'tmux'] | path_join }}"

    - name: Install
      community.general.make:
        target: install
        chdir: "{{ [distfiles_dir, 'tmux'] | path_join }}"
      become: true
